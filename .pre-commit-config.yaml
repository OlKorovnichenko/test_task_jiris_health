repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: debug-statements
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: poetry run mypy app migrations tests scripts
        language: system
        types_or: [python, pyi]
        pass_filenames: false
