name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: jiris_health_test
  POETRY_NO_INTERACTION: "1"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jiris_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jiris_health_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install poetry==2.5.1
          poetry install --with dev --no-root
      - name: Ruff
        run: |
          poetry run ruff check app migrations tests scripts
          poetry run ruff format --check app migrations tests scripts
      - name: Mypy
        run: poetry run mypy app migrations tests scripts
      - name: Prepare test database
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic check
      - name: Pytest
        run: poetry run pytest -v
