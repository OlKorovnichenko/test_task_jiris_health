[project]
name = "test-task-jiris-health"
version = "0.1.0"
description = ""
authors = [
    {name = "Oleksandr Korovnichenko",email = "oleksandr.korovnichenko@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)",
    "fastapi (>=0.163.1,<0.164.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "faststream[kafka] (>=0.7.8,<0.8.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)"
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
